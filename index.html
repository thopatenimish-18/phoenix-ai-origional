<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI Studio</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-icon phoenix-container">
                    <!-- Flying Phoenix SVG Animation -->
                    <svg class="phoenix-bird" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                        <defs>
                            <linearGradient id="wingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#ff4500" />
                                <stop offset="50%" stop-color="#ff8c00" />
                                <stop offset="100%" stop-color="#ffd700" />
                            </linearGradient>
                        </defs>
                        <!-- Left Wing -->
                        <path class="wing left" d="M50 50 C30 30 10 35 2 20 C15 35 30 45 50 50 Z" fill="url(#wingGrad)" />
                        <!-- Right Wing -->
                        <path class="wing right" d="M50 50 C70 30 90 35 98 20 C85 35 70 45 50 50 Z" fill="url(#wingGrad)" />
                        <!-- Body & Tail -->
                        <path d="M46 30 C50 20 54 20 58 30 C62 55 58 75 50 90 C42 75 38 55 46 30 Z" fill="#ff3300" />
                        <path d="M50 70 L43 95 L50 88 L57 95 Z" fill="#ffaa00" />
                        <!-- Head & Beak -->
                        <circle cx="50" cy="22" r="5" fill="#ffcc00" />
                        <polygon points="50,15 54,20 46,20" fill="#ff4500" />
                    </svg>
                </div>
                <div class="brand-text">
                    <h1>Phoenix AI</h1>
                    <span>Studio v2.0</span>
                </div>
            </div>

            <div class="nav-section">
                <p class="section-title">Quick Actions</p>
                <button class="preset-btn" onclick="sendPreset('Explain this coding concept clearly with an example')">
                    <span>💻</span> Code Debugger
                </button>
                <button class="preset-btn" onclick="sendPreset('Summarize this study topic into key bullet points')">
                    <span>📚</span> Study Summarizer
                </button>
                <button class="preset-btn" onclick="sendPreset('Create a practice quiz with questions for my exam')">
                    <span>🎯</span> Exam Prep
                </button>
                <button class="preset-btn" onclick="sendPreset('Brainstorm creative ideas for my project')">
                    <span>💡</span> Brainstormer
                </button>
            </div>

            <div class="sidebar-footer">
                <div class="status-indicator">
                    <span class="pulse-dot"></span>
                    <span>Groq Llama-3.1 Active</span>
                </div>
            </div>
        </aside>

        <!-- Main Chat Area -->
        <main class="chat-area">
            <header class="chat-topbar">
                <div class="topbar-info">
                    <h2>Phoenix Assistant</h2>
                    <p>Your intelligent companion for coding and studies</p>
                </div>
            </header>

            <div id="chat-box" class="chat-messages">
                <div class="message ai-message">
                    <div class="avatar">🔥</div>
                    <div class="content">Hello! I'm Phoenix. How can I help you master your studies or build your projects today?</div>
                </div>
            </div>

            <div class="chat-input-container">
                <div class="input-card">
                    <input type="text" id="user-input" placeholder="Ask Phoenix anything or paste code..." autocomplete="off" onkeydown="checkEnter(event)">
                    <button onclick="sendMessage()" class="send-btn" title="Send message">
                        <svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" stroke-width="2.5" fill="none"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
                <div class="footer-note">Powered by Groq High-Speed Inference</div>
            </div>
        </main>
    </div>
    <script src="script.js"></script>
</body>
</html>
