<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phoenix AI - Student Assistant</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="chat-container">
        <header>
            <h1>🔥 Phoenix AI</h1>
            <p>Your Personal Study & Code Assistant</p>
        </header>
        
        <div id="chat-box" class="chat-box"></div>
        
        <div class="input-area">
            <input type="text" id="user-input" placeholder="Ask Phoenix anything..." autocomplete="off">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
